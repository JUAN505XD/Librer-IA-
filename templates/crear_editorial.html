{% extends "base.html" %}
{% block content %}

<style>

.container {
    background: white;
    border-radius: 15px;
    max-width: 800px;
    margin: 40px auto;
    padding: 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

input {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    margin-top: 5px;
}

.btn {
    background: #0066cc;
    color: white;
    padding: 12px;
    border-radius: 8px;
    border: none;
    width: 100%;
    margin-top: 15px;
    cursor: pointer;
}

.error-box {
    background: #ffe6e6;
    color: #cc0000;
    padding: 10px;
    border-radius: 8px;
    margin-top: 10px;
    font-size: 14px;
    text-align: center;
    font-weight: bold;
}

</style>

<div class="container">

    <h2 style="text-align:center;">Crear Editorial</h2>

    <form method="post">
        {% csrf_token %}

        <label>Nombre de la editorial</label>
        <input type="text" name="nombre" required>

        {% if error %}
            <div class="error-box">{{ error }}</div>
        {% endif %}

        <button type="submit" class="btn">
            Guardar Editorial
        </button>

    </form>

</div>

{% endblock %}
