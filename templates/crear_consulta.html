{% extends "base.html" %}
{% block title %}Nueva Consulta{% endblock %}

{% block content %}

<style>

.container{
    max-width:700px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

input,
textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

textarea{
    min-height:150px;
    resize:vertical;
}

.btn{
    width:100%;
    background:#0066cc;
    color:white;
    border:none;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

</style>

<div class="container">

    <h2>Nueva Consulta</h2>

    <br>

    <form method="POST">

        {% csrf_token %}

        <label>Título</label>
        <br>
        <input type="text"
               name="titulo"
               required>

        <br><br>

        <label>Mensaje</label>
        <br>

        <textarea
            name="mensaje"
            required></textarea>

        <br><br>

        <button type="submit" class="btn">
            Crear Consulta
        </button>

    </form>

</div>

{% endblock %}
